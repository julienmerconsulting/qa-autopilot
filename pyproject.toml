[build-system]
requires = ["setuptools>=42,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-autopilot"
version = "1.2.3"
description = "AI-powered diagnostic for failing Playwright tests — multi-LLM, RGPD-friendly, open source. Detects root cause in seconds."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Julien Mer", email = "contact@julienmerconsulting.com"},
]
keywords = [
    "pytest",
    "pytest-plugin",
    "playwright",
    "playwright-python",
    "testing",
    "test-automation",
    "e2e",
    "end-to-end",
    "qa",
    "quality-assurance",
    "ai",
    "llm",
    "gpt",
    "openai",
    "anthropic",
    "deepseek",
    "ollama",
    "mistral",
    "groq",
    "diagnosis",
    "diagnostic",
    "debugging",
    "test-debugging",
    "self-healing",
    "test-failures",
    "root-cause-analysis",
    "rgpd",
    "gdpr",
    "privacy",
    "redaction",
    "data-protection",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Acceptance",
    "Topic :: Software Development :: Testing :: BDD",
    "Topic :: Software Development :: Testing :: Unit",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
    "Environment :: Console",
    "Environment :: Plugins",
    "Environment :: Web Environment",
    "Natural Language :: English",
    "Natural Language :: French",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = [
    "playwright>=1.40.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.4.0",
    "pytest-html>=4.0.0",
]
dotenv = [
    "python-dotenv>=1.0.0",
]
all = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.4.0",
    "pytest-html>=4.0.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://qa-julienmer-course.pages.dev/"
Repository = "https://github.com/julienmerconsulting/qa-autopilot"
Issues = "https://github.com/julienmerconsulting/qa-autopilot/issues"
Documentation = "https://qa-julienmer-course.pages.dev/"
Changelog = "https://github.com/julienmerconsulting/qa-autopilot/blob/main/CHANGELOG.md"
"Source Code" = "https://github.com/julienmerconsulting/qa-autopilot"
"Bug Tracker" = "https://github.com/julienmerconsulting/qa-autopilot/issues"

[project.entry-points.pytest11]
qa-autopilot = "qa_autopilot"

[project.scripts]
qa-autopilot = "qa_autopilot:main"

[tool.setuptools]
py-modules = ["qa_autopilot"]
license-files = []

[tool.pytest.ini_options]
addopts = "--tb=no -q"
testpaths = ["tests"]