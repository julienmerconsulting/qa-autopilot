[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-autopilot"
version = "1.0.0"
description = "AI-powered diagnostic for Playwright test failures — ~600 lines replace 23K lines of MCP"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Julien Mer", email = "contact@jmer-consulting.com"},
]
keywords = ["qa", "testing", "playwright", "automation", "ai", "diagnostic", "pytest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "playwright>=1.40.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-playwright>=0.4.0",
    "pytest-html>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/jmer-consulting/qa-autopilot"
Repository = "https://github.com/jmer-consulting/qa-autopilot"
Issues = "https://github.com/jmer-consulting/qa-autopilot/issues"
Documentation = "https://github.com/jmer-consulting/qa-autopilot#readme"

[project.entry-points.pytest11]
qa-autopilot = "qa_autopilot"

[project.scripts]
qa-autopilot = "qa_autopilot:main"

[tool.setuptools]
py-modules = ["qa_autopilot"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]
